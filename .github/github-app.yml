# Copilot App project config, generated by the actions-migrator migration-setup skill.
# Reference: https://docs.github.com/copilot/reference/github-copilot-app-reference/repository-configuration
instructions: |
  This repository is being migrated to GitHub Actions with the actions-migrator plugin.
  Use the jenkins-migrator agent for migration requests.
  Migrate only the real source files in this repo; never invent pipelines.
  Archive originals to .github/ci-archive/, validate with actionlint, and open a PR with the migration report.

scripts:
  - name: Migration preflight
    command: |
      for t in jq actionlint gh; do
        if command -v "$t" >/dev/null 2>&1; then echo "ok: $t"; else echo "missing: $t"; fi
      done
    triggers:
      - session.create
  - name: Validate workflows
    command: actionlint
  - name: Show migration scorecard
    command: cat .github/MIGRATION-SCORECARD.md

automation:
  auto_issue_session: true
